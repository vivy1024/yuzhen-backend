server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # 安全: 隐藏服务器版本号
    server_tokens off;

    # 文件上传大小限制
    client_max_body_size 100M;
    
    # CORS配置 - 允许前端访问（支持多域名）
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost:(9000|9001|9002|5173)|app\.yuzhen-fitness\.cn|yuzhen-fitness\.cn|www\.yuzhen-fitness\.cn|yuzhen\.preview\.aliyun-zeabur\.cn|yuzhenapi\.preview\.aliyun-zeabur\.cn)$") {
        set $cors_origin $http_origin;
    }
    
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Internal-Token" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;
    
    # 处理OPTIONS预检请求
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # 静态文件（storage）
    location /storage/ {
        try_files $uri $uri/ =404;
    }
    
    location ~ \.php$ {
        fastcgi_pass php_v2:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;

        # 安全: 隐藏PHP版本
        fastcgi_hide_header X-Powered-By;
    }
    
    # 隐藏敏感文件
    location ~ /\. {
        deny all;
    }
}


