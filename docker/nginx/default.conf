server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    
    # 文件上传大小限制
    client_max_body_size 100M;
    
    # CORS配置 - 允许前端访问
    add_header Access-Control-Allow-Origin "http://localhost:9000" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Internal-Token" always;
    add_header Access-Control-Allow-Credentials "true" always;
    
    # 处理OPTIONS预检请求
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # 静态文件（storage）CORS配置
    location /storage/ {
        add_header Access-Control-Allow-Origin "http://localhost:9000" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;
        try_files $uri $uri/ =404;
    }
    
    location ~ \.php$ {
        fastcgi_pass php_v2:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}





